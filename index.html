<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fdecef" />
  <title>Pink Creator Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page-shell">

    <aside class="pink-rail" aria-label="Welcome message">

      <div class="welcome-text">
        WELCOME TO MY PINK WORLD~
      </div>

    

    </aside>


    <main class="creator-card">

      <section class="profile" aria-label="Creator profile">

        <div class="picture-frame">

          <img
            class="creator-picture"
            src="assets/creator-placeholder.png"
            alt="Creator profile"
          />

        </div>


        <div class="creator-name">
          name 
        </div>


        <p class="creator-bio">
          text zone (bio)
        </p>

      </section>


      <nav class="platform-list" aria-label="Creator platforms">

        <a
          class="platform-button"
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            class="platform-icon"
            src="assets/instagram.png"
            alt=""
            aria-hidden="true"
          />

          <span>Instagram</span>

        </a>


        <a
          class="platform-button"
          href="https://www.tiktok.com/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            class="platform-icon"
            src="assets/tiktok.png"
            alt=""
            aria-hidden="true"
          />

          <span>TikTok</span>

        </a>


        <a
          class="platform-button"
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            class="platform-icon"
            src="assets/youtube.png"
            alt=""
            aria-hidden="true"
          />

          <span>YouTube</span>

        </a>


        <a
            class="platform-button collab-button"
            href="mailto:creator@email.com"        
            >

        
          <img
            class="platform-icon"
            src="assets/email.png"
            alt=""
            aria-hidden="true"
          />

          <span>Email</span>

        </a>

      </nav>

    </main>

  </div>

</body>
</html>
